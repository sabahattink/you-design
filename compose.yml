name: you-design

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: ghcr.io/sabahattink/you-design-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: ghcr.io/sabahattink/you-design-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-youdesign}:${POSTGRES_PASSWORD:-youdesign}@postgres:5432/${POSTGRES_DB:-youdesign}
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 3001
      API_CORS_ORIGINS: http://localhost:3000
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  collab:
    build:
      context: .
      dockerfile: docker/Dockerfile.collab
    image: ghcr.io/sabahattink/you-design-collab:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-youdesign}:${POSTGRES_PASSWORD:-youdesign}@postgres:5432/${POSTGRES_DB:-youdesign}
      COLLAB_PORT: 3002
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: ghcr.io/sabahattink/you-design-api:latest
    restart: unless-stopped
    command: ['node', 'apps/api/dist/worker.js']
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-youdesign}:${POSTGRES_PASSWORD:-youdesign}@postgres:5432/${POSTGRES_DB:-youdesign}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-youdesign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-youdesign}
      POSTGRES_DB: ${POSTGRES_DB:-youdesign}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-youdesign}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
