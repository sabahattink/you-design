name: you-design-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: youdesign
      POSTGRES_PASSWORD: youdesign
      POSTGRES_DB: youdesign
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    ports:
      # Override with POSTGRES_HOST_PORT env var if 5434 conflicts.
      - '${POSTGRES_HOST_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U youdesign']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data-dev:/data
    ports:
      # Override with REDIS_HOST_PORT env var if 6381 conflicts.
      - '${REDIS_HOST_PORT:-6381}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data-dev:
  redis-data-dev:
